[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeplag"
version = "0.1.0"
description = "Code plagiarism detection using semantic tree analysis and neural embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "transformers>=4.40",
  "tree-sitter>=0.22",
  "tree-sitter-python",
  "tree-sitter-java",
  "tree-sitter-javascript",
  "numpy",
  "scikit-learn",
  "networkx",
  "zss",              # Zhang-Shasha tree edit distance
  "pydantic>=2",
  "pyyaml",
  "typer",
  "tqdm",
  "matplotlib",       # evaluation plots
  "psutil",           # memory measurements in efficiency benchmarks
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "pre-commit", "jupyterlab", "types-PyYAML"]
openvino = ["openvino>=2026.4,<2027"]
# Web API + worker (web/api). Tests also need fakeredis and httpx.
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "arq>=0.26",
  "redis>=5",
  "pydantic-settings>=2",
  "python-multipart>=0.0.9",
  "reportlab>=4",
]
web-dev = ["fakeredis>=2.26", "httpx>=0.27"]

[project.scripts]
codeplag = "codeplag.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=codeplag --cov-report=term-missing"
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["tests/fixtures", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Header"]

[tool.ruff.lint.isort]
known-first-party = ["codeplag", "tests", "api", "conftest"]
